<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具集 · 2026 · Atelier</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <style>
    /* ==========================================
       Product Detail — 作品运行时 · 光影几何
       ========================================== */

    html, body { height: 100%; overflow: hidden; }
    body { background: #000; }

    /* ———— IFrame 全屏 ———— */
    .runtime-frame {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .runtime-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ———— 浮动工具栏 ———— */
    .runtime-toolbar {
      position: fixed;
      top: var(--sp-md);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      padding: var(--sp-sm) var(--sp-md);
      background: oklch(0.08 0.01 270 / 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      font-size: var(--fs-meta);
      font-family: var(--ff-body);
      color: var(--c-fg);
    }

    .runtime-toolbar__back {
      display: flex;
      align-items: center;
      gap: var(--sp-2xs);
      padding: var(--sp-2xs) var(--sp-sm);
      background: none;
      border: none;
      color: var(--c-fg-dim);
      cursor: pointer;
      font-family: var(--ff-mono);
      font-size: var(--fs-meta);
      transition: color 0.3s ease;
    }

    .runtime-toolbar__back:hover { color: var(--c-fg); }

    .runtime-toolbar__divider {
      width: 1px;
      height: 16px;
      background: var(--c-border);
    }

    .runtime-toolbar__title {
      font-weight: 400;
      font-size: var(--fs-small);
    }

    .runtime-toolbar__actions {
      display: flex;
      gap: var(--sp-xs);
      margin-left: auto;
    }

    .runtime-toolbar__action {
      padding: var(--sp-2xs) var(--sp-sm);
      background: none;
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      color: var(--c-fg-dim);
      cursor: pointer;
      font-family: var(--ff-body);
      font-size: var(--fs-meta);
      transition: all 0.3s ease;
    }

    .runtime-toolbar__action:hover {
      border-color: var(--c-border-l);
      color: var(--c-fg);
    }

    /* ———— 信息面板 (抽屉) ———— */
    .info-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      transform: translateY(calc(100% - 48px));
      transition: transform 0.5s var(--ease-expo);
      background: oklch(0.06 0.008 270 / 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--c-border);
    }

    .info-panel--open {
      transform: translateY(0);
    }

    .info-panel__handle {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      cursor: pointer;
      user-select: none;
    }

    .info-panel__handle-bar {
      width: 32px;
      height: 3px;
      border-radius: 2px;
      background: var(--c-muted);
      transition: background 0.3s ease;
    }

    .info-panel__handle:hover .info-panel__handle-bar {
      background: var(--c-fg-dim);
    }

    .info-panel__body {
      padding: 0 var(--sp-xl) var(--sp-xl);
      max-height: 50vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: var(--sp-xl);
    }

    .info-panel__cover {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: saturate(0.5) contrast(1.15);
      border-radius: var(--radius-sm);
    }

    .info-panel__content {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .info-panel__title {
      font-family: var(--ff-display);
      font-size: var(--fs-h2);
      font-weight: 400;
    }

    .info-panel__desc {
      color: var(--c-fg-dim);
      font-size: var(--fs-body);
      line-height: 1.7;
    }

    .info-panel__meta {
      display: flex;
      gap: var(--sp-lg);
      font-family: var(--ff-mono);
      font-size: var(--fs-small);
      color: var(--c-fg-dim);
    }

    .info-panel__meta-item {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2xs);
    }

    .info-panel__meta-label {
      font-size: var(--fs-meta);
      color: var(--c-muted);
      letter-spacing: 0.05em;
    }

    /* ———— 响应式 ———— */
    @media (max-width: 768px) {
      .runtime-toolbar {
        top: auto;
        bottom: var(--sp-md);
        width: min(92%, 400px);
        flex-wrap: wrap;
        justify-content: center;
      }
      .info-panel__body {
        grid-template-columns: 1fr;
        padding: 0 var(--sp-lg) var(--sp-lg);
      }
      .info-panel__cover { max-width: 160px; }
    }

    /* ———— 状态覆盖 ———— */
    .state-override { display: none; }
    body[data-state="loading"] .state-default { display: none; }
    body[data-state="loading"] .state-loading { display: flex; }
    body[data-state="error"] .state-default { display: none; }
    body[data-state="error"] .state-error { display: flex; }
    body[data-state="empty"] .state-default .runtime-frame iframe { display: none; }
    body[data-state="empty"] .state-empty { display: flex; }
  </style>
</head>
<body>

  <main class="state-default">
    <!-- IFrame 运行环境 -->
    <div class="runtime-frame">
      <iframe src="about:blank" sandbox="allow-scripts allow-same-origin" title="作品运行环境"></iframe>
    </div>

    <!-- 工具栏 -->
    <div class="runtime-toolbar">
      <a href="products.html" class="runtime-toolbar__back">← 返回</a>
      <span class="runtime-toolbar__divider"></span>
      <span class="runtime-toolbar__title">工具集 · 2026</span>
      <div class="runtime-toolbar__actions">
        <button class="runtime-toolbar__action" onclick="window.open('about:blank','_blank')">新窗口</button>
        <button class="runtime-toolbar__action" onclick="document.querySelector('.info-panel').classList.toggle('info-panel--open')">信息</button>
      </div>
    </div>

    <!-- 信息面板 -->
    <div class="info-panel">
      <div class="info-panel__handle" onclick="this.parentElement.classList.toggle('info-panel--open')">
        <div class="info-panel__handle-bar"></div>
      </div>
      <div class="info-panel__body">
        <img src="../images/metal-ruler.png" alt="测量工具" class="info-panel__cover" loading="lazy" />
        <div class="info-panel__content">
          <h2 class="info-panel__title">工具集 · 2026</h2>
          <p class="info-panel__desc">一组日常开发工具的摄影记录。从键盘到精密工具，通过俯拍和均匀打光，呈现工具本身的几何美感和材质细节。</p>
          <div class="info-panel__meta">
            <div class="info-panel__meta-item">
              <span class="info-panel__meta-label">标识</span>
              <span>tools-2026</span>
            </div>
            <div class="info-panel__meta-item">
              <span class="info-panel__meta-label">状态</span>
              <span>在线</span>
            </div>
            <div class="info-panel__meta-item">
              <span class="info-panel__meta-label">更新</span>
              <span>2026.06.01</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 状态: Loading -->
  <div class="state-card state-loading state-override" style="min-height:100vh">
    <div class="state-card__icon" style="animation:pulse 1.5s ease-in-out infinite">⟳</div>
    <div class="state-card__title">加载中</div>
    <p class="state-card__desc">正在加载运行环境…</p>
    <style>@keyframes pulse { 0%,100% { opacity:0.3; } 50% { opacity:0.8; } }</style>
  </div>

  <!-- 状态: Error -->
  <div class="state-card state-error state-override" style="min-height:100vh">
    <div class="state-card__icon">!</div>
    <div class="state-card__title">加载失败</div>
    <p class="state-card__desc">运行环境不可用。</p>
    <a href="products.html" class="btn" style="margin-top:var(--sp-lg)">返回作品列表</a>
  </div>

  <!-- 状态: Empty (无运行文件) -->
  <div class="state-card state-empty state-override" style="min-height:100vh">
    <div class="state-card__icon">—</div>
    <div class="state-card__title">暂无可运行文件</div>
    <p class="state-card__desc">此作品已发布但尚未上传运行文件。</p>
    <a href="products.html" class="btn" style="margin-top:var(--sp-lg)">返回作品列表</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('state')) document.body.dataset.state = params.get('state');
    })();
  </script>
</body>
</html>
