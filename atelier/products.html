<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品 · Atelier</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <style>
    /* ==========================================
       Products — 作品 · 动态画廊体验
       ========================================== */

    /* ———— Hero 视差 ———— */
    .products-hero {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .products-hero__bg {
      position: absolute;
      inset: -10% -10%;
      will-change: transform;
    }

    .products-hero__bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .products-hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        oklch(0 0 0 / 0.55) 0%,
        oklch(0 0 0 / 0.25) 50%,
        var(--c-bg) 100%
      );
    }

    .products-hero__content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .products-hero__label {
      font-family: var(--ff-mono);
      font-size: var(--fs-meta);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: oklch(0.7 0.01 270 / 0.5);
      margin-bottom: var(--sp-md);
    }

    .products-hero__title {
      font-family: var(--ff-display);
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 400;
      color: #fff;
      line-height: 1.1;
      text-shadow: 0 2px 32px oklch(0 0 0 / 0.4);
      margin-bottom: var(--sp-sm);
    }

    .products-hero__desc {
      color: oklch(0.7 0.01 270 / 0.7);
      font-weight: 300;
      font-size: var(--fs-body);
      text-shadow: 0 1px 12px oklch(0 0 0 / 0.5);
    }

    /* ———— 画廊 ———— */
    .gallery {
      padding: var(--sp-xl) 0 var(--sp-3xl);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.7fr 1fr;
      grid-auto-rows: 240px;
      gap: 2px;
    }

    .gallery-card {
      position: relative;
      overflow: hidden;
      background: var(--c-bg);
      cursor: pointer;
    }

    .gallery-card__img {
      width: 100%;
      height: 100%;
    }

    .gallery-card__img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.35) contrast(1.2);
      transition: transform 0.8s var(--ease-expo), filter 0.8s var(--ease-expo);
    }

    .gallery-card:hover img {
      transform: scale(1.06);
      filter: saturate(0.5) contrast(1.3);
    }

    /* 尺寸变体 */
    .gallery-card--wide  { grid-column: span 2; }
    .gallery-card--tall  { grid-row: span 2; }
    .gallery-card--large { grid-column: span 2; grid-row: span 2; }

    /* 状态徽标 */
    .gallery-card__status {
      position: absolute;
      top: var(--sp-md);
      right: var(--sp-md);
      font-family: var(--ff-mono);
      font-size: var(--fs-meta);
      padding: 0.25em 0.7em;
      border: 1px solid rgb(255 255 255 / 0.12);
      color: oklch(0.68 0.01 270 / 0.6);
      background: oklch(0 0 0 / 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2;
      transition: all 0.4s var(--ease-expo);
    }

    .gallery-card__status--live {
      border-color: oklch(0.72 0.01 270 / 0.35);
      color: oklch(0.85 0.01 270);
    }

    .gallery-card:hover .gallery-card__status {
      border-color: rgb(255 255 255 / 0.25);
      color: oklch(0.9 0.01 270);
    }

    /* 信息浮层 — hover 时渐显 */
    .gallery-card__info {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--sp-lg);
      background: linear-gradient(transparent 30%, oklch(0 0 0 / 0.85));
      opacity: 0;
      transition: opacity 0.5s var(--ease-expo);
    }

    .gallery-card:hover .gallery-card__info {
      opacity: 1;
    }

    .gallery-card__title {
      font-family: var(--ff-display);
      font-size: var(--fs-h3);
      font-weight: 400;
      color: #fff;
    }

    .gallery-card__desc {
      font-size: var(--fs-small);
      color: oklch(0.68 0.01 270 / 0.55);
      margin-top: var(--sp-2xs);
    }

    /* ———— 响应式 ———— */
    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 240px;
      }
      .gallery-card--large { grid-column: span 2; grid-row: span 2; }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
      }
      .gallery-card {
        aspect-ratio: 16 / 10;
        min-height: 200px;
      }
      .gallery-card--wide,
      .gallery-card--tall,
      .gallery-card--large {
        grid-column: span 1;
        grid-row: span 1;
      }
      .products-hero { min-height: 300px; height: 40vh; }
    }

    /* ———— 状态覆盖 ———— */
    .state-override { display: none; }
    body[data-state="loading"] .state-default { display: none; }
    body[data-state="loading"] .state-loading { display: flex; }
    body[data-state="error"] .state-default { display: none; }
    body[data-state="error"] .state-error { display: flex; }
    body[data-state="empty"] .state-default .gallery-grid { display: none; }
    body[data-state="empty"] .state-empty { display: flex; }
  </style>
</head>
<body>

  <!-- 导航（初始透明，滚动后 solid） -->
  <nav class="nav-v2" id="mainNav">
    <a href="index.html" class="nav-v2__brand">Atelier</a>
    <div class="nav-v2__links">
      <a href="home.html" class="nav-v2__link">首页</a>
      <a href="blog.html" class="nav-v2__link">笔记</a>
      <a href="products.html" class="nav-v2__link active">作品</a>
      <a href="about.html" class="nav-v2__link">关于</a>
    </div>
  </nav>

  <main class="state-default">

    <!-- Hero 视差区 -->
    <header class="products-hero" id="productsHero">
      <div class="products-hero__bg" id="heroBg">
        <img src="../images/plaster-geometric.png" alt="几何石膏体" loading="eager" />
      </div>
      <div class="products-hero__overlay"></div>
      <div class="products-hero__content">
        <p class="products-hero__label">/ 作品</p>
        <h1 class="products-hero__title">项目与实验</h1>
        <p class="products-hero__desc">从工具到创意项目，每一个都经过反复打磨</p>
      </div>
    </header>

    <!-- 画廊 -->
    <section class="gallery">
      <div class="container">
        <div class="gallery-grid">

          <!-- 大图：工具集 -->
          <a class="gallery-card gallery-card--large" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/plaster-geometric.png" alt="几何石膏体" loading="lazy" />
            </div>
            <span class="gallery-card__status gallery-card__status--live">在线</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">工具集 · 2026</h2>
              <p class="gallery-card__desc">日常开发工具的摄影记录</p>
            </div>
          </a>

          <!-- 键帽微距 -->
          <a class="gallery-card" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/perforated-metal-shadow.png" alt="穿孔金属板光影" loading="lazy" />
            </div>
            <span class="gallery-card__status">存档</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">键帽微距</h2>
              <p class="gallery-card__desc">细节中的几何构成</p>
            </div>
          </a>

          <!-- 百叶窗投影 -->
          <a class="gallery-card" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/venetian-blind-shadow.png" alt="百叶窗" loading="lazy" />
            </div>
            <span class="gallery-card__status gallery-card__status--live">在线</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">百叶窗投影</h2>
              <p class="gallery-card__desc">光影作为空间骨架</p>
            </div>
          </a>

          <!-- 阴影研究 -->
          <a class="gallery-card gallery-card--wide" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/glass-shadow.png" alt="阴影研究" loading="lazy" />
            </div>
            <span class="gallery-card__status gallery-card__status--live">在线</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">阴影研究</h2>
              <p class="gallery-card__desc">透明物体的光线行为</p>
            </div>
          </a>

          <!-- 折纸几何 -->
          <a class="gallery-card" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/paper-folds-shadow.png" alt="折纸几何" loading="lazy" />
            </div>
            <span class="gallery-card__status">研究</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">折纸几何</h2>
              <p class="gallery-card__desc">纸的折叠与光影构成</p>
            </div>
          </a>

          <!-- 棱镜折射 -->
          <a class="gallery-card" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/prism-light.png" alt="棱镜折射" loading="lazy" />
            </div>
            <span class="gallery-card__status">研究</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">棱镜折射</h2>
              <p class="gallery-card__desc">光在透明介质中的行为</p>
            </div>
          </a>

          <!-- 网格投影 -->
          <a class="gallery-card gallery-card--wide" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/grid-shadow.png" alt="网格投影" loading="lazy" />
            </div>
            <span class="gallery-card__status gallery-card__status--live">在线</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">网格投影</h2>
              <p class="gallery-card__desc">金属网格与重复阴影图案的构成研究</p>
            </div>
          </a>

          <!-- 金属尺 -->
          <a class="gallery-card" href="product-detail.html">
            <div class="gallery-card__img">
              <img src="../images/metal-ruler.png" alt="金属尺微距" loading="lazy" />
            </div>
            <span class="gallery-card__status">研究</span>
            <div class="gallery-card__info">
              <h2 class="gallery-card__title">金属尺 · 微距</h2>
              <p class="gallery-card__desc">精密工具表面的光影与材质</p>
            </div>
          </a>

        </div>
      </div>
    </section>

  </main>

  <!-- 状态: Loading -->
  <div class="state-card state-loading state-override" style="min-height:100vh">
    <div class="state-card__icon" style="animation:pulse 1.5s ease-in-out infinite">⟳</div>
    <div class="state-card__title">加载中</div>
    <p class="state-card__desc">正在获取作品列表…</p>
    <style>@keyframes pulse { 0%,100% { opacity:0.3; } 50% { opacity:0.8; } }</style>
  </div>

  <!-- 状态: Error -->
  <div class="state-card state-error state-override" style="min-height:100vh">
    <div class="state-card__icon">!</div>
    <div class="state-card__title">加载失败</div>
    <p class="state-card__desc">无法连接到服务器，请稍后重试。</p>
    <button class="btn" style="margin-top:var(--sp-lg)" onclick="location.reload()">重新加载</button>
  </div>

  <!-- 状态: Empty -->
  <div class="state-card state-empty state-override" style="min-height:100vh">
    <div class="state-card__icon">—</div>
    <div class="state-card__title">暂无作品</div>
    <p class="state-card__desc">还没有发布任何作品。</p>
  </div>

  <script>
    (function() {
      'use strict';

      // ——— 导航栏滚动 solid ———
      const nav = document.getElementById('mainNav');
      const hero = document.getElementById('productsHero');

      function updateNav() {
        if (hero) {
          const heroBottom = hero.getBoundingClientRect().bottom;
          nav.classList.toggle('nav-v2--solid', heroBottom < 60);
        }
      }

      window.addEventListener('scroll', updateNav, { passive: true });
      updateNav();

      // ——— Hero 视差 ———
      const heroBg = document.getElementById('heroBg');
      if (heroBg) {
        window.addEventListener('scroll', function() {
          const scrollY = window.scrollY;
          const heroTop = hero.offsetTop;
          const offset = (scrollY - heroTop) * 0.25;
          heroBg.style.transform = 'translateY(' + offset + 'px)';
        }, { passive: true });
      }

      // ——— IntersectionObserver 进场动画 ———
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            observer.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));

      // ——— URL 参数状态 ———
      const params = new URLSearchParams(window.location.search);
      if (params.get('state')) document.body.dataset.state = params.get('state');
    })();
  </script>
</body>
</html>
