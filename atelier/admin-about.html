<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于页 · 管理后台 · Atelier</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="admin-tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }

    /* 联系人行 */
    .contact-row {
      display: flex;
      gap: var(--sp-sm);
      align-items: center;
      margin-bottom: var(--sp-sm);
    }

    .contact-row__select { width: 140px; }
    .contact-row__name { width: 110px; }
    .contact-row__url { flex: 1; }

    /* 信息卡片行 */
    .infocard-row {
      display: flex;
      gap: var(--sp-sm);
      align-items: center;
      margin-bottom: var(--sp-sm);
    }

    .infocard-row__label { flex: 1; }
    .infocard-row__value { flex: 1; }

    /* Hero 预览 */
    .hero-preview {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-sm) var(--sp-md);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: var(--admin-radius-sm);
    }

    .hero-preview__avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--c-surf-2);
    }

    .hero-preview__info {
      font-size: var(--fs-small);
      color: var(--c-fg-dim);
    }

    .hero-preview__info strong {
      color: var(--c-fg);
    }

    /* 编辑/预览切换 */
    .editor-tabs {
      display: flex;
      gap: var(--sp-xs);
      margin-bottom: var(--sp-sm);
    }

    .editor-tab {
      padding: 4px 12px;
      font-family: var(--ff-mono);
      font-size: 11px;
      border: 1px solid var(--c-border);
      background: transparent;
      color: var(--c-fg-dim);
      cursor: pointer;
      border-radius: var(--admin-radius-sm);
      transition: all 0.2s var(--ease-expo);
    }

    .editor-tab--active {
      border-color: var(--c-accent);
      color: var(--c-accent);
      background: oklch(0.55 0.06 90 / 0.1);
    }

    .editor-tab:hover {
      border-color: var(--c-border-l);
      color: var(--c-fg);
    }

    /* 标签输入 */
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: var(--sp-sm);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: var(--admin-radius-sm);
      min-height: 40px;
      cursor: text;
    }

    .tech-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-family: var(--ff-mono);
      font-size: 11px;
      border: 1px solid var(--c-border-l);
      border-radius: var(--admin-radius-sm);
      color: var(--c-fg-dim);
    }

    .tech-tag__remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: none;
      background: transparent;
      color: var(--c-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    .tech-tag__remove:hover { color: var(--c-danger); }

    .tech-tag-input {
      flex: 1;
      min-width: 80px;
      border: none;
      background: transparent;
      color: var(--c-fg);
      font-family: var(--ff-body);
      font-size: var(--fs-small);
      outline: none;
      padding: 2px 0;
    }

    .admin-btn--add {
      border-color: var(--c-border);
      color: var(--c-fg-dim);
      font-family: var(--ff-mono);
      font-size: 11px;
      height: 30px;
    }

    .admin-btn--add:hover {
      border-color: var(--c-accent);
      color: var(--c-accent);
    }

    /* 成功/错误消息覆盖 */
    .msg-banner {
      padding: var(--sp-sm) var(--sp-md);
      border-radius: var(--admin-radius-sm);
      font-size: var(--fs-small);
      margin-bottom: var(--sp-lg);
    }
  </style>
</head>
<body class="admin-body">
  <!-- ========== 侧边栏 ========== -->
  <aside class="admin-sidebar admin-sidebar--open" id="sidebar">
    <div class="admin-sidebar__header">
      <span class="admin-sidebar__brand" id="sidebarBrand">管理后台</span>
      <button class="admin-sidebar__toggle" id="sidebarToggle" title="收起侧边栏" onclick="toggleSidebar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="admin-nav__label">仪表盘</span></a>
      <a href="admin-articles.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 19.5z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg><span class="admin-nav__label">文章管理</span></a>
      <a href="admin-products.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg><span class="admin-nav__label">产品管理</span></a>
      <a href="admin-about.html" class="admin-nav__item admin-nav__item--active"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="admin-nav__label">关于页</span></a>
      <a href="admin-mascot.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="14" r="3"/><path d="M12 2a4 4 0 0 1 4 4c0 1.1-.7 2.6-1.5 3.5M9 10c-2 0-4 1-4 3s1 3 2 3.5M15 10c2 0 4 1 4 3s-1 3-2 3.5"/></svg><span class="admin-nav__label">看板娘</span></a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="index.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="admin-nav__label">返回首页</span></a>
      <button class="admin-nav__item" onclick="handleLogout()"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="admin-nav__label">退出登录</span></a>
    </div>
  </aside>

  <!-- ========== 主内容 ========== -->
  <main class="admin-main">
    <div class="admin-main__inner">
      <form id="aboutForm" onsubmit="saveAbout(event)">
        <div class="admin-page-header">
          <div>
            <div class="admin-page-header__label">Console</div>
            <h1 class="admin-page-header__title">关于页</h1>
            <p class="admin-page-header__desc">编辑 Hero 头部、信息卡片、技术栈、联系方式与正文内容。</p>
          </div>
          <div class="admin-page-header__actions">
            <a href="/about" class="admin-btn" target="_blank">前台预览 →</a>
            <button class="admin-btn admin-btn--primary" type="submit">保存</button>
          </div>
        </div>

        <!-- 消息横幅 -->
        <div id="errorBanner" style="display:none;" class="msg-banner" style="border:1px solid var(--c-danger);background:var(--c-danger-bg);color:var(--c-danger);">保存失败</div>
        <div id="successBanner" style="display:none;" class="msg-banner" style="border:1px solid var(--c-status-green);background:var(--c-status-green-bg);color:var(--c-status-green);">已保存</div>

        <!-- ===== Hero 头部 ===== -->
        <div class="admin-section">
          <h2 class="admin-section__title">Hero 头部</h2>
          <div class="admin-form-grid">
            <div class="admin-form-group">
              <label class="admin-form-label">Eyebrow 标签</label>
              <input class="admin-input" type="text" id="aboutEyebrow" value="About" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">主标题</label>
              <input class="admin-input" type="text" id="aboutTitle" value="August's Lab" required placeholder="August's Lab" />
            </div>
          </div>
          <div class="admin-form-grid">
            <div class="admin-form-group">
              <label class="admin-form-label">头像 URL</label>
              <input class="admin-input" type="text" id="aboutAvatar" placeholder="/images/avatar.jpg" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">一句话简介</label>
              <input class="admin-input" type="text" id="aboutSubtitle" placeholder="全栈开发者 / 独立开发者" />
            </div>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">封面图 URL</label>
            <input class="admin-input" type="text" id="aboutCover" placeholder="/images/brand/about-workbench.webp" />
          </div>
          <!-- Hero 实时预览 -->
          <div class="hero-preview">
            <img class="hero-preview__avatar" id="heroAvatarPreview" src="" alt="" />
            <div class="hero-preview__info">
              <span id="heroEyebrowPreview" style="color:var(--c-fg-dim);">About</span>
              <strong id="heroTitlePreview">August's Lab</strong>
              <span id="heroSubtitlePreview"></span>
            </div>
          </div>
        </div>

        <!-- ===== 信息卡片 ===== -->
        <div class="admin-section">
          <h2 class="admin-section__title">信息卡片</h2>
          <div id="infoCardsContainer">
            <div class="infocard-row">
              <input class="admin-input infocard-row__label" type="text" placeholder="标签（如：职位）" value="职位" />
              <input class="admin-input infocard-row__value" type="text" placeholder="值（如：全栈开发者）" value="全栈开发者 / 独立设计师" />
              <button type="button" class="admin-btn admin-btn--ghost" onclick="removeInfoCard(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>
            </div>
            <div class="infocard-row">
              <input class="admin-input infocard-row__label" type="text" placeholder="标签（如：职位）" value="地点" />
              <input class="admin-input infocard-row__value" type="text" placeholder="值（如：全栈开发者）" value="中国 · 杭州" />
              <button type="button" class="admin-btn admin-btn--ghost" onclick="removeInfoCard(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>
            </div>
          </div>
          <button type="button" class="admin-btn admin-btn--add" onclick="addInfoCard()">+ 添加卡片</button>
        </div>

        <!-- ===== 技术栈 ===== -->
        <div class="admin-section">
          <h2 class="admin-section__title">技术栈标签</h2>
          <div class="tech-tags" id="techTags" onclick="focusTechInput()">
            <span class="tech-tag">React<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span></span>
            <span class="tech-tag">TypeScript<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span></span>
            <span class="tech-tag">Node.js<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span></span>
            <span class="tech-tag">Python<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span></span>
            <span class="tech-tag">PostgreSQL<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span></span>
            <input class="tech-tag-input" id="techInput" placeholder="输入后按回车添加" onkeydown="addTech(event)" />
          </div>
        </div>

        <!-- ===== 联系方式 ===== -->
        <div class="admin-section">
          <h2 class="admin-section__title">联系方式</h2>
          <div id="contactsContainer">
            <div class="contact-row">
              <select class="admin-select contact-row__select">
                <option value="github" selected>GitHub</option>
                <option value="twitter">Twitter / X</option>
                <option value="email">Email</option>
                <option value="linkedin">LinkedIn</option>
                <option value="custom">自定义</option>
              </select>
              <input class="admin-input contact-row__url" type="text" placeholder="URL" value="https://github.com/august" />
              <button type="button" class="admin-btn admin-btn--ghost" onclick="removeContact(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>
            </div>
            <div class="contact-row">
              <select class="admin-select contact-row__select">
                <option value="twitter">Twitter / X</option>
                <option value="github">GitHub</option>
                <option value="email">Email</option>
                <option value="linkedin">LinkedIn</option>
                <option value="custom">自定义</option>
              </select>
              <input class="admin-input contact-row__url" type="text" placeholder="URL" value="https://x.com/august" />
              <button type="button" class="admin-btn admin-btn--ghost" onclick="removeContact(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>
            </div>
          </div>
          <button type="button" class="admin-btn admin-btn--add" onclick="addContact()">+ 添加联系方式</button>
        </div>

        <!-- ===== 正文内容 ===== -->
        <div class="admin-section">
          <h2 class="admin-section__title">正文内容（可选）</h2>
          <div class="admin-form-group">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-sm);">
              <label class="admin-form-label" style="margin-bottom:0;">格式</label>
              <select class="admin-select" id="contentType" style="width:140px;" onchange="toggleContentType()">
                <option value="markdown">Markdown</option>
                <option value="html">HTML</option>
              </select>
            </div>
            <div class="editor-tabs" id="editorTabs">
              <button type="button" class="editor-tab editor-tab--active" id="editTab" onclick="switchEditorTab('edit')">编辑</button>
              <button type="button" class="editor-tab" id="previewTab" onclick="switchEditorTab('preview')">预览</button>
            </div>
            <textarea class="admin-textarea" id="aboutContent" rows="8" style="display:block;" placeholder="输入 Markdown 内容...">全栈开发者，独立设计师，热爱光影几何与印刷质感的设计语言。这个站点是我在数字空间中的实验工坊——记录想法、展示作品、打磨手艺。</textarea>
            <div class="admin-textarea" id="aboutPreview" style="display:none;white-space:pre-wrap;line-height:1.7;font-family:var(--ff-body);cursor:default;">全栈开发者，独立设计师，热爱光影几何与印刷质感的设计语言。这个站点是我在数字空间中的实验工坊——记录想法、展示作品、打磨手艺。</div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- ========== 退出弹窗 ========== -->
  <div class="admin-modal-overlay" id="logoutModal">
    <div class="admin-modal">
      <h3 class="admin-modal__title">退出登录</h3>
      <p class="admin-modal__desc">确定要退出管理后台吗？</p>
      <div class="admin-modal__actions">
        <button class="admin-btn" onclick="closeLogoutModal()">取消</button>
        <button class="admin-btn admin-btn--danger" onclick="confirmLogout()">退出</button>
      </div>
    </div>
  </div>

  <script>
    var sidebarCollapsed = localStorage.getItem('atelier-admin-sidebar') === 'collapsed';
    function applySidebarState() {
      var s = document.getElementById('sidebar');
      var b = document.getElementById('sidebarBrand');
      var labels = document.querySelectorAll('.admin-nav__label');
      var t = document.getElementById('sidebarToggle');
      if (sidebarCollapsed) {
        s.classList.remove('admin-sidebar--open'); s.classList.add('admin-sidebar--closed');
        b.classList.add('admin-sidebar__brand--hidden');
        labels.forEach(function(l) { l.classList.add('admin-nav__label--hidden'); });
        t.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'; t.title = '展开侧边栏';
      } else {
        s.classList.remove('admin-sidebar--closed'); s.classList.add('admin-sidebar--open');
        b.classList.remove('admin-sidebar__brand--hidden');
        labels.forEach(function(l) { l.classList.remove('admin-nav__label--hidden'); });
        t.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'; t.title = '收起侧边栏';
      }
    }
    function toggleSidebar() { sidebarCollapsed = !sidebarCollapsed; localStorage.setItem('atelier-admin-sidebar', sidebarCollapsed ? 'collapsed' : 'open'); applySidebarState(); }
    applySidebarState();

    function handleLogout() { document.getElementById('logoutModal').classList.add('admin-modal-overlay--open'); }
    function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('admin-modal-overlay--open'); }
    function confirmLogout() { closeLogoutModal(); }
    document.getElementById('logoutModal').addEventListener('click', function(e) { if (e.target === this) closeLogoutModal(); });

    // =========================================
    // Hero 预览联动
    // =========================================
    document.getElementById('aboutTitle').addEventListener('input', function() {
      document.getElementById('heroTitlePreview').textContent = this.value || 'August\'s Lab';
    });
    document.getElementById('aboutEyebrow').addEventListener('input', function() {
      document.getElementById('heroEyebrowPreview').textContent = this.value || 'About';
    });
    document.getElementById('aboutSubtitle').addEventListener('input', function() {
      var el = document.getElementById('heroSubtitlePreview');
      var val = this.value;
      el.textContent = val ? '— ' + val : '';
    });
    document.getElementById('aboutAvatar').addEventListener('input', function() {
      document.getElementById('heroAvatarPreview').src = this.value || '';
    });

    // =========================================
    // 技术栈标签
    // =========================================
    function focusTechInput() {
      document.getElementById('techInput').focus();
    }

    function addTech(e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var input = document.getElementById('techInput');
      var val = input.value.trim();
      if (!val) return;
      var tag = document.createElement('span');
      tag.className = 'tech-tag';
      tag.innerHTML = val + '<span class="tech-tag__remove" onclick="event.stopPropagation();removeTech(this)">×</span>';
      input.parentNode.insertBefore(tag, input);
      input.value = '';
    }

    function removeTech(el) {
      el.parentNode.remove();
    }

    // =========================================
    // 信息卡片
    // =========================================
    function addInfoCard() {
      var container = document.getElementById('infoCardsContainer');
      var row = document.createElement('div');
      row.className = 'infocard-row';
      row.innerHTML = '<input class="admin-input infocard-row__label" type="text" placeholder="标签（如：职位）" />' +
        '<input class="admin-input infocard-row__value" type="text" placeholder="值（如：全栈开发者）" />' +
        '<button type="button" class="admin-btn admin-btn--ghost" onclick="removeInfoCard(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>';
      container.appendChild(row);
    }

    function removeInfoCard(btn) {
      btn.parentNode.remove();
    }

    // =========================================
    // 联系方式
    // =========================================
    function addContact() {
      var container = document.getElementById('contactsContainer');
      var row = document.createElement('div');
      row.className = 'contact-row';
      row.innerHTML = '<select class="admin-select contact-row__select">' +
        '<option value="github">GitHub</option>' +
        '<option value="twitter">Twitter / X</option>' +
        '<option value="email">Email</option>' +
        '<option value="linkedin">LinkedIn</option>' +
        '<option value="custom">自定义</option>' +
        '</select>' +
        '<input class="admin-input contact-row__url" type="text" placeholder="URL" />' +
        '<button type="button" class="admin-btn admin-btn--ghost" onclick="removeContact(this)" style="height:30px;padding:0 8px;font-size:12px;color:var(--c-danger);">移除</button>';
      container.appendChild(row);
    }

    function removeContact(btn) {
      btn.parentNode.remove();
    }

    // =========================================
    // 正文编辑/预览切换
    // =========================================
    function toggleContentType() {
      var ct = document.getElementById('contentType').value;
      document.getElementById('editorTabs').style.display = ct === 'markdown' ? 'flex' : 'none';
      document.getElementById('aboutContent').style.display = 'block';
      document.getElementById('aboutPreview').style.display = 'none';
    }

    function switchEditorTab(tab) {
      document.getElementById('editTab').classList.toggle('editor-tab--active', tab === 'edit');
      document.getElementById('previewTab').classList.toggle('editor-tab--active', tab === 'preview');
      document.getElementById('aboutContent').style.display = tab === 'edit' ? 'block' : 'none';
      document.getElementById('aboutPreview').style.display = tab === 'preview' ? 'block' : 'none';
      if (tab === 'preview') {
        document.getElementById('aboutPreview').textContent = document.getElementById('aboutContent').value;
      }
    }

    // =========================================
    // 保存
    // =========================================
    function saveAbout(e) {
      e.preventDefault();
      var banner = document.getElementById('successBanner');
      banner.style.display = 'flex';
      banner.textContent = '已保存';
      setTimeout(function() { banner.style.display = 'none'; }, 3000);
    }
  </script>
