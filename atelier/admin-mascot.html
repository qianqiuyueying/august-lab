<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看板娘 · 管理后台 · Atelier</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="admin-tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }

    /* 两栏布局 */
    .mascot-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: var(--sp-lg);
      align-items: start;
    }

    .mascot-main { min-width: 0; }

    @media (max-width: 860px) {
      .mascot-layout { grid-template-columns: 1fr; }
    }

    /* 滑块 */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--c-border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c-accent);
      border: none;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c-accent);
      border: none;
      cursor: pointer;
    }

    /* 测试连接按钮状态 */
    .test-conn-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-family: var(--ff-mono);
      font-size: 11px;
      border: 1px solid var(--c-border);
      background: transparent;
      color: var(--c-fg-dim);
      border-radius: var(--admin-radius-sm);
      cursor: pointer;
      transition: all 0.2s var(--ease-expo);
    }
    .test-conn-btn:hover { border-color: var(--c-border-l); color: var(--c-fg); }
    .test-conn-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .test-conn-btn--success { border-color: var(--c-status-green); color: var(--c-status-green); }
    .test-conn-btn--fail { border-color: var(--c-danger); color: var(--c-danger); }
    .test-conn-btn__spinner { display: none; animation: spin 0.8s linear infinite; }
    .test-conn-btn--loading .test-conn-btn__spinner { display: inline-block; }
    .test-conn-btn--loading .test-conn-btn__text { display: none; }
    .test-conn-result {
      margin-top: var(--sp-xs);
      font-family: var(--ff-mono);
      font-size: 10px;
      padding: 4px 10px;
      border-radius: var(--admin-radius-sm);
      display: none;
    }
    .test-conn-result--show { display: block; }
    .test-conn-result--success { color: var(--c-status-green); background: var(--c-status-green-bg); }
    .test-conn-result--fail { color: var(--c-danger); background: var(--c-danger-bg); }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 看板娘预览 */
    .mascot-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-sm);
      padding: var(--sp-md);
      margin-top: var(--sp-sm);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: var(--admin-radius-sm);
      min-height: 100px;
      justify-content: center;
    }
    .mascot-preview__canvas {
      transition: transform 0.15s var(--ease-expo);
      transform-origin: center center;
    }
    .mascot-preview__hint {
      font-size: 10px;
      color: var(--c-muted);
      font-family: var(--ff-mono);
    }
  </style>
</head>
<body class="admin-body">
  <!-- ========== 侧边栏 ========== -->
  <aside class="admin-sidebar admin-sidebar--open" id="sidebar">
    <div class="admin-sidebar__header">
      <span class="admin-sidebar__brand" id="sidebarBrand">管理后台</span>
      <button class="admin-sidebar__toggle" id="sidebarToggle" title="收起侧边栏" onclick="toggleSidebar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="admin-nav__label">仪表盘</span></a>
      <a href="admin-articles.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 19.5z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg><span class="admin-nav__label">文章管理</span></a>
      <a href="admin-products.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg><span class="admin-nav__label">产品管理</span></a>
      <a href="admin-about.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="admin-nav__label">关于页</span></a>
      <a href="admin-mascot.html" class="admin-nav__item admin-nav__item--active"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="14" r="3"/><path d="M12 2a4 4 0 0 1 4 4c0 1.1-.7 2.6-1.5 3.5M9 10c-2 0-4 1-4 3s1 3 2 3.5M15 10c2 0 4 1 4 3s-1 3-2 3.5"/></svg><span class="admin-nav__label">看板娘</span></a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="index.html" class="admin-nav__item"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="admin-nav__label">返回首页</span></a>
      <button class="admin-nav__item" onclick="handleLogout()"><svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="admin-nav__label">退出登录</span></a>
    </div>
  </aside>

  <!-- ========== 主内容 ========== -->
  <main class="admin-main">
    <div class="admin-main__inner">
      <form id="mascotForm" onsubmit="saveMascot(event)">
        <div class="admin-page-header">
          <div>
            <div class="admin-page-header__label">Console</div>
            <h1 class="admin-page-header__title">看板娘设置</h1>
            <p class="admin-page-header__desc">配置 AI 看板娘的角色人设、API 连接与行为表现。</p>
          </div>
          <div class="admin-page-header__actions">
            <button class="admin-btn admin-btn--primary" type="submit">保存设置</button>
          </div>
        </div>

        <!-- 消息 -->
        <div id="errorBanner" style="display:none;border:1px solid var(--c-danger);background:var(--c-danger-bg);color:var(--c-danger);" class="msg-banner">保存失败</div>
        <div id="successBanner" style="display:none;border:1px solid var(--c-status-green);background:var(--c-status-green-bg);color:var(--c-status-green);" class="msg-banner">设置已保存</div>

        <div class="mascot-layout">

          <!-- ===== 左栏 ===== -->
          <div class="mascot-main">

            <!-- 人设 -->
            <div class="admin-section">
              <h2 class="admin-section__title">人设（System Prompt）</h2>
              <div class="admin-form-group">
                <label class="admin-form-label">角色提示词</label>
                <textarea class="admin-textarea" id="mascotPersona" rows="6" placeholder="你是一只可爱的看板娘……">你是一位名叫「小光」的看板娘，性格温柔亲切，擅长用简洁温暖的语言介绍这个站点的内容和设计师的创作思路。你可以用中文回答，语速自然，偶尔带一点可爱的语气词但不要过度。当用户询问站点相关内容时，你会基于已有信息给出有帮助的回答。</textarea>
              </div>
            </div>

            <!-- API 配置 -->
            <div class="admin-section">
              <h2 class="admin-section__title">API 配置</h2>
              <div class="admin-form-group">
                <label class="admin-form-label">API Key</label>
                <input class="admin-input" type="password" id="mascotApiKey" placeholder="sk-..." value="sk-demo-key-xxxxxxxx" />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Base URL</label>
                <input class="admin-input" type="text" id="mascotBaseUrl" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1" />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Model</label>
                <input class="admin-input" type="text" id="mascotModel" placeholder="gpt-4o-mini" value="gpt-4o-mini" />
              </div>
              <div class="admin-form-group" style="margin-bottom:0;">
                <button class="test-conn-btn" id="testConnBtn" onclick="testConnection()" type="button">
                  <span class="test-conn-btn__spinner">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="32"/></svg>
                  </span>
                  <span class="test-conn-btn__text">测试连接</span>
                </button>
                <div class="test-conn-result" id="testConnResult"></div>
              </div>
              <div class="admin-form-grid">
                <div class="admin-form-group">
                  <label class="admin-form-label">Temperature (<span id="tempVal">0.7</span>)</label>
                  <input type="range" min="0" max="2" step="0.1" value="0.7" id="mascotTemp" oninput="document.getElementById('tempVal').textContent=this.value" />
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label">Max Tokens</label>
                  <input class="admin-input" type="number" id="mascotMaxTokens" value="256" min="1" max="4096" />
                </div>
              </div>
            </div>

            <!-- 行为设置 -->
            <div class="admin-section">
              <h2 class="admin-section__title">行为设置</h2>
              <div class="admin-form-grid">
                <label class="admin-toggle">
                  <input type="checkbox" checked id="mascotGreeting" />
                  启用问候语
                </label>
                <div class="admin-form-group">
                  <label class="admin-form-label">问候延迟（秒）</label>
                  <input class="admin-input" type="number" id="mascotGreetingDelay" value="3" min="0" max="120" />
                </div>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">随机动作间隔（秒）</label>
                <input class="admin-input" type="number" id="mascotActionInterval" value="60" min="10" max="3600" />
              </div>
              <div style="display:flex;gap:var(--sp-lg);flex-wrap:wrap;">
                <label class="admin-toggle">
                  <input type="checkbox" checked id="mascotContextAware" />
                  上下文感知
                </label>
                <label class="admin-toggle">
                  <input type="checkbox" checked id="mascotDraggable" />
                  允许拖拽
                </label>
              </div>
            </div>
          </div>

          <!-- ===== 右栏 ===== -->
          <div class="mascot-sidebar">
            <!-- 开关 -->
            <div class="admin-section">
              <h2 class="admin-section__title">开关</h2>
              <div style="display:flex;flex-direction:column;gap:var(--sp-md);">
                <label class="admin-toggle" style="justify-content:space-between;">
                  <span>启用看板娘</span>
                  <input type="checkbox" checked id="mascotEnabled" />
                </label>
                <label class="admin-toggle" style="justify-content:space-between;">
                  <span>显示形象</span>
                  <input type="checkbox" checked id="mascotVisible" />
                </label>
                <label class="admin-toggle" style="justify-content:space-between;">
                  <span>移动端显示</span>
                  <input type="checkbox" id="mascotMobile" />
                </label>
              </div>
            </div>

            <!-- 外观 -->
            <div class="admin-section">
              <h2 class="admin-section__title">外观</h2>
              <div class="admin-form-group">
                <label class="admin-form-label">缩放比例 (<span id="scaleVal">1.0</span>)</label>
                <input type="range" min="0.5" max="3" step="0.1" value="1.0" id="mascotScale" oninput="updateScalePreview()" />
              </div>
              <div class="mascot-preview">
                <div class="mascot-preview__canvas" id="mascotPreviewCanvas">
                  <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="28" r="14" fill="oklch(0.55 0.06 90 / 0.15)" stroke="oklch(0.55 0.06 90 / 0.4)" stroke-width="1"/>
                    <circle cx="24" cy="25" r="1.5" fill="oklch(0.55 0.06 90 / 0.6)"/>
                    <circle cx="36" cy="25" r="1.5" fill="oklch(0.55 0.06 90 / 0.6)"/>
                    <path d="M24 33c1.5 2 4 3 6 3s4.5-1 6-3" stroke="oklch(0.55 0.06 90 / 0.5)" stroke-width="1" stroke-linecap="round"/>
                    <path d="M18 10l-4-4M42 10l4-4" stroke="oklch(0.55 0.06 90 / 0.3)" stroke-width="1" stroke-linecap="round"/>
                    <rect x="26" y="44" width="8" height="12" rx="1" fill="oklch(0.55 0.06 90 / 0.12)" stroke="oklch(0.55 0.06 90 / 0.3)" stroke-width="0.8"/>
                    <circle cx="30" cy="48" r="1.5" fill="oklch(0.55 0.06 90 / 0.15)" stroke="oklch(0.55 0.06 90 / 0.3)" stroke-width="0.5"/>
                  </svg>
                </div>
                <span class="mascot-preview__hint">外观实时预览 · 拖动滑条查看缩放效果</span>
              </div>
            </div>

            <!-- 保存按钮（移动端） -->
            <div style="display:none;" class="admin-section" id="mobileSaveBtn">
              <button class="admin-btn admin-btn--primary" type="submit" style="width:100%;">保存设置</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- ========== 退出弹窗 ========== -->
  <div class="admin-modal-overlay" id="logoutModal">
    <div class="admin-modal">
      <h3 class="admin-modal__title">退出登录</h3>
      <p class="admin-modal__desc">确定要退出管理后台吗？</p>
      <div class="admin-modal__actions">
        <button class="admin-btn" onclick="closeLogoutModal()">取消</button>
        <button class="admin-btn admin-btn--danger" onclick="confirmLogout()">退出</button>
      </div>
    </div>
  </div>

  <script>
    var sidebarCollapsed = localStorage.getItem('atelier-admin-sidebar') === 'collapsed';
    function applySidebarState() {
      var s = document.getElementById('sidebar');
      var b = document.getElementById('sidebarBrand');
      var labels = document.querySelectorAll('.admin-nav__label');
      var t = document.getElementById('sidebarToggle');
      if (sidebarCollapsed) {
        s.classList.remove('admin-sidebar--open'); s.classList.add('admin-sidebar--closed');
        b.classList.add('admin-sidebar__brand--hidden');
        labels.forEach(function(l) { l.classList.add('admin-nav__label--hidden'); });
        t.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'; t.title = '展开侧边栏';
      } else {
        s.classList.remove('admin-sidebar--closed'); s.classList.add('admin-sidebar--open');
        b.classList.remove('admin-sidebar__brand--hidden');
        labels.forEach(function(l) { l.classList.remove('admin-nav__label--hidden'); });
        t.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'; t.title = '收起侧边栏';
      }
    }
    function toggleSidebar() { sidebarCollapsed = !sidebarCollapsed; localStorage.setItem('atelier-admin-sidebar', sidebarCollapsed ? 'collapsed' : 'open'); applySidebarState(); }
    applySidebarState();

    function handleLogout() { document.getElementById('logoutModal').classList.add('admin-modal-overlay--open'); }
    function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('admin-modal-overlay--open'); }
    function confirmLogout() { closeLogoutModal(); }
    document.getElementById('logoutModal').addEventListener('click', function(e) { if (e.target === this) closeLogoutModal(); });

    function saveMascot(e) {
      e.preventDefault();
      var banner = document.getElementById('successBanner');
      banner.style.display = 'flex';
      setTimeout(function() { banner.style.display = 'none'; }, 3000);
    }

    // =========================================
    // 测试连接
    // =========================================
    function testConnection() {
      var btn = document.getElementById('testConnBtn');
      var result = document.getElementById('testConnResult');
      btn.classList.remove('test-conn-btn--success', 'test-conn-btn--fail');
      btn.classList.add('test-conn-btn--loading');
      btn.disabled = true;
      result.classList.remove('test-conn-result--show', 'test-conn-result--success', 'test-conn-result--fail');

      var baseUrl = document.getElementById('mascotBaseUrl').value || 'https://api.openai.com/v1';
      var apiKey = document.getElementById('mascotApiKey').value || '';
      var model = document.getElementById('mascotModel').value || 'gpt-4o-mini';

      // 模拟真实 API 调用（设计原型中如果 API 不可达，自动回落为模拟）
      var startTime = Date.now();
      fetch(baseUrl + '/models', {
        headers: { 'Authorization': 'Bearer ' + apiKey }
      })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        var elapsed = Date.now() - startTime;
        if (elapsed < 800) return;
        btn.classList.remove('test-conn-btn--loading');
        btn.classList.add('test-conn-btn--success');
        btn.disabled = false;
        result.textContent = '✓ 连接成功 (' + elapsed + 'ms) — 模型列表可用';
        result.className = 'test-conn-result test-conn-result--show test-conn-result--success';
      })
      .catch(function() {
        // 如果真实请求失败，显示模拟成功（毕竟是设计原型）
        setTimeout(function() {
          btn.classList.remove('test-conn-btn--loading');
          btn.classList.add('test-conn-btn--success');
          btn.disabled = false;
          result.textContent = '✓ 配置格式正确（原型模式 · 未检测实际可用性）';
          result.className = 'test-conn-result test-conn-result--show test-conn-result--success';
        }, Math.max(0, 800 - (Date.now() - startTime)));
      });
    }

    // =========================================
    // 外观实时预览
    // =========================================
    function updateScalePreview() {
      var scale = parseFloat(document.getElementById('mascotScale').value);
      document.getElementById('scaleVal').textContent = scale.toFixed(1);
      var canvas = document.getElementById('mascotPreviewCanvas');
      canvas.style.transform = 'scale(' + scale + ')';
    }

    // =========================================
    // 响应式：窄屏时在左栏底部显示保存按钮
    // =========================================
    var mq = window.matchMedia('(max-width: 860px)');
    mq.addEventListener('change', function(e) {
      document.getElementById('mobileSaveBtn').style.display = e.matches ? 'block' : 'none';
    });
    if (mq.matches) document.getElementById('mobileSaveBtn').style.display = 'block';
  </script>
</body>
</html>
