<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大鱼吃小鱼</title>
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div>
    <div id="score">分数: 0</div>
    <div id="level">等级: 1</div>
    <div id="xpBarContainer"><div id="xpBar"></div></div>
  </div>
  <button id="restartBtn">重新开始</button>
</div>
<div id="overlay">
  <h1>🐟 大鱼吃小鱼</h1>
  <p>WASD / 方向键控制你的鱼，吃掉比你小的鱼，躲避比你大的鱼！</p>
  <button id="startBtn">开始游戏</button>
  <div id="deathInfo" style="display:none; text-align:center; margin-top:10px;">
    <div id="deathScore"></div>
    <div id="deathLevel"></div>
    <div id="highScore"></div>
  </div>
</div>
<div id="pauseOverlay">
  <h2>⏸ 暂停</h2>
  <p>按 P 或 Escape 继续</p>
</div>
<div id="levelUpText"></div>
<div id="flashOverlay"></div>
<div id="instructions">WASD / 方向键移动 · 吃小鱼 · 躲大鱼 · P 暂停</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
