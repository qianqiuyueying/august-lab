name: Deploy

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖 & 类型检查
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit
      - run: npx prisma generate
      - run: npx tsc --noEmit

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: rsync 源码到服务器
        run: |
          SERVER="root@192.144.154.17"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=30"

          ssh ${SSH_OPTS} ${SERVER} "mkdir -p /opt/august-lab"

          rsync -az --delete --timeout=60 -e "ssh ${SSH_OPTS}" \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.git/' \
            --exclude 'atelier/' \
            --exclude 'docs/' \
            --exclude '.env' \
            ./ "${SERVER}:/opt/august-lab/"

      - name: Docker Compose 部署
        run: |
          ssh root@192.144.154.17 'bash -s' << 'REMOTE_SCRIPT'
            set -e
            cd /opt/august-lab

            # 写入环境变量（仅首次）
            if [ ! -f .env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            fi

            docker compose down --remove-orphans --timeout 30 2>/dev/null || true
            docker network rm august-lab_default 2>/dev/null || true
            docker compose up -d --build --force-recreate

            echo "=== 数据库迁移 ==="
            docker compose exec -T app npx prisma migrate deploy || true

            echo "=== 状态 ==="
            docker compose ps
            sleep 3
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 || echo "等待启动..."
          REMOTE_SCRIPT
