name: Deploy

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --registry=https://registry.npmmirror.com
      - run: npx prisma generate
      - run: npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: |
          SERVER="root@192.144.154.17"
          SSH="ssh -o StrictHostKeyChecking=no"

          $SSH ${SERVER} "mkdir -p /opt/august-lab"

          rsync -az --delete --timeout=60 -e "$SSH" \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.git/' \
            --exclude 'atelier/' \
            --exclude 'docs/' \
            --exclude 'public/uploads/' \
            --exclude 'public/mascot/' \
            --exclude '.env' \
            ./ ${SERVER}:/opt/august-lab/

          $SSH ${SERVER} 'bash -s' << 'ENDSCRIPT'
            set -e
            cd /opt/august-lab

            if [ ! -f .env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            fi

            docker compose down --remove-orphans --timeout 30 2>/dev/null || true
            docker compose up -d --build
            docker compose exec -T app npx prisma migrate deploy || true

            sleep 2
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 || echo "..."
          ENDSCRIPT
