name: Deploy

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --registry=https://registry.npmmirror.com
      - run: npx prisma generate
      - run: npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: |
          SERVER="root@192.144.154.17"
          SSH="ssh -o StrictHostKeyChecking=no"

          $SSH ${SERVER} "mkdir -p /opt/august-lab/.next/static /opt/august-lab/public /opt/august-lab/prisma"

          rsync -az --delete --exclude node_modules -e "$SSH" .next/standalone/ ${SERVER}:/opt/august-lab/
          rsync -az --delete -e "$SSH" .next/static/       ${SERVER}:/opt/august-lab/.next/static/
          rsync -az -e "$SSH" --exclude uploads/ --exclude mascot/ public/ ${SERVER}:/opt/august-lab/public/
          rsync -az          -e "$SSH" prisma/              ${SERVER}:/opt/august-lab/prisma/

          $SSH ${SERVER} 'bash -s' << 'ENDSCRIPT'
            set -e
            cd /opt/august-lab

            if [ ! -f .env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
            fi

            which pm2 || npm i -g pm2 --registry=https://registry.npmmirror.com
            npm ci --production --no-audit --registry=https://registry.npmmirror.com

            npx prisma migrate deploy

            pm2 delete august-lab 2>/dev/null || true
            pm2 start server.js --name august-lab
            pm2 save

            sleep 2
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 && echo "OK" || echo "..."
          ENDSCRIPT
