name: Deploy

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 & 推送镜像
        run: |
          docker build -t ghcr.io/qianqiuyueying/august-lab:latest .
          docker push ghcr.io/qianqiuyueying/august-lab:latest

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 服务器部署
        run: |
          ssh -o StrictHostKeyChecking=no root@192.144.154.17 'bash -s' << 'REMOTE_SCRIPT'
            set -e
            mkdir -p /opt/august-lab
            cd /opt/august-lab

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u qianqiuyueying --password-stdin

            # 写入环境变量（仅首次）
            if [ ! -f .env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            fi

            # 创建 docker-compose.yml（仅首次）
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml << 'COMPOSE'
            services:
              app:
                image: ghcr.io/qianqiuyueying/august-lab:latest
                container_name: august-lab
                restart: unless-stopped
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                environment:
                  - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/augustlab
                depends_on:
                  db:
                    condition: service_healthy

              db:
                image: postgres:16-alpine
                container_name: august-lab-db
                restart: unless-stopped
                environment:
                  - POSTGRES_USER=postgres
                  - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
                  - POSTGRES_DB=augustlab
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

            volumes:
              pgdata:
            COMPOSE
            fi

            docker compose pull app
            docker compose down --remove-orphans --timeout 30 2>/dev/null || true
            docker compose up -d

            echo "=== 数据库迁移 ==="
            docker compose exec -T app npx prisma migrate deploy || true

            echo "=== 状态 ==="
            docker compose ps
            sleep 3
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 || echo "等待启动..."
          REMOTE_SCRIPT
