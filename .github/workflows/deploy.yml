name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: 安装依赖
        run: |
          cd backend
          uv venv
          uv pip install -r requirements.txt

      - name: 检查导入
        run: |
          cd backend
          uv run python -c "from app.main import app; print('Backend imports OK')"

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          cd frontend
          npm ci

      - name: 类型检查 + 构建
        run: |
          cd frontend
          npm run build

  deploy:
    name: 部署到服务器
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 配置 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加服务器到已知主机
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 192.144.154.17 >> ~/.ssh/known_hosts

      - name: 部署到服务器
        run: |
          ssh root@192.144.154.17 << 'REMOTE_SCRIPT'
            set -e
            DEPLOY_DIR="/opt/blog"
            mkdir -p "$DEPLOY_DIR"

            # 配置 BT-Panel Nginx 反向代理（如果还没有的话）
            NGINX_CONF="/www/server/panel/vhost/nginx/blog.conf"
            if [ ! -f "$NGINX_CONF" ]; then
              cat > "$NGINX_CONF" << 'NGINX_EOF'
            upstream blog {
                server 127.0.0.1:8080;
            }

            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://blog;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX_EOF
              nginx -t && nginx -s reload
              echo "Nginx config applied"
            fi

            # 拉取最新代码
            cd "$DEPLOY_DIR"
            git init -q 2>/dev/null || true
            git remote set-url origin git@github.com:qianqiuyueying/august-lab.git 2>/dev/null || git remote add origin git@github.com:qianqiuyueying/august-lab.git
            git fetch origin main
            git reset --hard origin/main

            # 构建前端
            cd "$DEPLOY_DIR/frontend"
            npm ci
            npm run build

            # 启动容器
            cd "$DEPLOY_DIR"
            docker compose up -d --build

            # 验证
            sleep 5
            curl -sf http://localhost/api/health && echo " | Backend OK" || echo " | Backend NOT READY"
            curl -sf -o /dev/null -w "HTTP %{http_code} | Frontend" http://localhost/ || echo " | Frontend NOT READY"
          REMOTE_SCRIPT
