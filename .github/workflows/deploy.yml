name: Deploy

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建 & 部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖 & 构建
        run: |
          npm ci --no-audit
          npx prisma generate
          npm run build

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 部署到服务器
        run: |
          SERVER="root@192.144.154.17"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=30"

          echo "::group::准备目录"
          ssh ${SSH_OPTS} ${SERVER} "mkdir -p /opt/august-lab/.next/static /opt/august-lab/public /opt/august-lab/prisma"

          echo "::group::同步构建产物"
          rsync -az --delete -e "ssh ${SSH_OPTS}" .next/standalone/ ${SERVER}:/opt/august-lab/
          rsync -az --delete -e "ssh ${SSH_OPTS}" .next/static/ ${SERVER}:/opt/august-lab/.next/static/
          rsync -az -e "ssh ${SSH_OPTS}" public/ ${SERVER}:/opt/august-lab/public/
          rsync -az -e "ssh ${SSH_OPTS}" prisma/ ${SERVER}:/opt/august-lab/prisma/

          echo "::group::配置并重启"
          ssh ${SSH_OPTS} ${SERVER} 'bash -s' << 'ENDSCRIPT'
            cd /opt/august-lab

            # 写入环境变量（仅首次，后续不覆盖）
            if [ ! -f .env ]; then
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
            fi

            # 安装 PM2（如果还没有）
            which pm2 || npm i -g pm2

            # 迁移数据库
            npx prisma migrate deploy

            # 重启应用
            pm2 delete august-lab 2>/dev/null || true
            pm2 start server.js --name august-lab
            pm2 save

            sleep 2
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 && echo "OK" || echo "等待..."
          ENDSCRIPT
