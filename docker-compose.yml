services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    volumes:
      - blog-data:/app/data
      - products-data:/app/products
    environment:
      - BLOG_SECRET_KEY=${BLOG_SECRET_KEY:-your-secret-key-change-in-production}
    networks:
      - blog-net

  frontend:
    image: nginx:alpine
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - blog-net

volumes:
  blog-data:
  products-data:

networks:
  blog-net:
